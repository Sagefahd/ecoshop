{% extends "base.html" %}
{% block title %}Verify code — EcoShop Ghana{% endblock %}

{% block content %}
<div class="max-w-md mx-auto card p-6 sm:p-8 mt-8">
    <h1 class="font-display text-2xl font-bold mb-2">Enter the code</h1>
    <p class="text-sm text-forest/60 mb-6">We sent a 6-digit code to <span class="font-medium text-forest">{{ phone_number }}</span></p>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.code }}
        {% if form.code.errors %}
            <p class="field-error"><svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" /></svg>{{ form.code.errors.0 }}</p>
        {% endif %}
        <button class="btn-primary w-full">Verify &amp; continue</button>
    </form>

    <form method="post" action="{% url 'accounts:resend_otp' %}" class="mt-4 text-center">
        {% csrf_token %}
        <button class="text-sm text-forest/60 hover:text-gold underline">Didn't get a code? Resend</button>
    </form>
</div>
{% endblock %}
